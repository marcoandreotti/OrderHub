services:
  web:
    build:
      context: .
      dockerfile: web/OrderHub.Web/Dockerfile.dev
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8080
      VITE_USE_POLLING: "true"
    ports: !override
      - "${WEB_PORT:-9000}:9000"
    volumes:
      - ./web/OrderHub.Web:/app
      - orderhub-web-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  orderhub-web-node-modules:
